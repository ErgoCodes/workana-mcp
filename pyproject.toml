[project]
name = "workana-mcp"
version = "0.1.0"
description = "Servidor MCP (solo lectura) para buscar y evaluar proyectos freelance en Workana"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0,<2",
    "httpx>=0.27",
    "curl_cffi>=0.7",
    "beautifulsoup4>=4.12",
    "pydantic>=2",
]

[project.scripts]
workana-mcp = "workana_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workana_mcp"]
